<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#1a5fb4"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f5f4"/>
      <stop offset="1" stop-color="#deddda"/>
    </linearGradient>
    <linearGradient id="panelL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#99c1f1"/>
      <stop offset="1" stop-color="#62a0ea"/>
    </linearGradient>
    <linearGradient id="panelR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ff0a4"/>
      <stop offset="1" stop-color="#57e389"/>
    </linearGradient>
  </defs>

  <!-- Monitor body -->
  <rect x="10" y="12" width="108" height="76" rx="8" ry="8" fill="url(#bg)"/>
  <rect x="12" y="14" width="104" height="72" rx="6" ry="6" fill="#1c1c1c"/>

  <!-- Screen -->
  <rect x="18" y="20" width="92" height="56" rx="2" ry="2" fill="url(#screen)"/>

  <!-- PBP split: left panel -->
  <rect x="19" y="21" width="44" height="54" rx="1" ry="1" fill="url(#panelL)"/>
  <!-- PBP split: right panel -->
  <rect x="65" y="21" width="44" height="54" rx="1" ry="1" fill="url(#panelR)"/>

  <!-- Divider line -->
  <line x1="64" y1="22" x2="64" y2="74" stroke="#1c1c1c" stroke-width="1.5" opacity="0.6"/>

  <!-- Content lines on left panel -->
  <rect x="25" y="32" width="24" height="3" rx="1.5" fill="#1a5fb4" opacity="0.5"/>
  <rect x="25" y="38" width="18" height="3" rx="1.5" fill="#1a5fb4" opacity="0.35"/>
  <rect x="25" y="44" width="21" height="3" rx="1.5" fill="#1a5fb4" opacity="0.35"/>

  <!-- Content lines on right panel -->
  <rect x="71" y="32" width="24" height="3" rx="1.5" fill="#26a269" opacity="0.5"/>
  <rect x="71" y="38" width="18" height="3" rx="1.5" fill="#26a269" opacity="0.35"/>
  <rect x="71" y="44" width="21" height="3" rx="1.5" fill="#26a269" opacity="0.35"/>

  <!-- PIP indicator (small inset window, bottom-right of right panel) -->
  <rect x="82" y="56" width="22" height="14" rx="2" ry="2"
        fill="#1c1c1c" opacity="0.15" stroke="#1c1c1c" stroke-width="0.75" stroke-opacity="0.3"/>

  <!-- Stand neck -->
  <rect x="52" y="88" width="24" height="10" rx="2" ry="2" fill="#1a5fb4"/>
  <!-- Stand base -->
  <rect x="36" y="96" width="56" height="7" rx="3.5" ry="3.5" fill="url(#bg)"/>

  <!-- Subtle monitor power LED -->
  <circle cx="64" cy="84" r="1.5" fill="#57e389" opacity="0.7"/>
</svg>
